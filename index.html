function startRun(){cancelAnimationFrame(runRAF);const r=$('#run');if(!r)return;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 let paused=false,resume=0,acc=0,last=0;const pause=()=>{paused=true;clearTimeout(resume)},later=()=>{clearTimeout(resume);resume=setTimeout(()=>paused=false,2500)};
 r.addEventListener('pointerenter',pause);r.addEventListener('pointerleave',later);r.addEventListener('touchstart',pause,{passive:true});r.addEventListener('touchend',later,{passive:true});r.addEventListener('focusin',pause);r.addEventListener('focusout',later);r.addEventListener('wheel',()=>{pause();later()},{passive:true});
 const step=t=>{if(!document.body.contains(r))return;const dt=last?Math.min(t-last,50):16;last=t;
  if(!paused&&!document.hidden){acc+=dt*0.035;if(acc>=1){const px=Math.floor(acc);acc-=px;r.scrollLeft+=px}}
  const half=r.scrollWidth/2;if(r.scrollLeft>=half)r.scrollLeft-=half;else if(r.scrollLeft<=0&&paused)r.scrollLeft+=half;
  runRAF=requestAnimationFrame(step)};runRAF=requestAnimationFrame(step)}

/* ===== AI photo suggestions (Gemini via Firebase AI Logic) ===== */
let aiModels=null,lastPhoto=null;
const AI_PROMPT=`You help Leo Furniture, a furniture workshop in Serem, Kenya, list products in its online shop.
Look at the photo and identify the main furniture piece. Reply with JSON only:
{"name": short product name a Kenyan furniture shop would use, 2 to 6 words, sentence case (e.g. "Classic coffee table", "Arched TV wall unit", "7-seater L-shaped sofa"),
 "category": exactly one of "wall","kitchen","table","coffee","couch","interior","custom"
   (wall = TV wall units and display cabinets; kitchen = kitchen cabinets; table = dining tables, office desks and other big tables;
    coffee = coffee tables and side tables; couch = sofas, couches and armchairs; interior = a finished room or interior design work;
    custom = beds, wardrobes, doors, shelves, school or church furniture and anything else),
 "description": 2 sentences, at most 350 characters, in plain friendly English, describing what a buyer can see: type, style, colour or finish, and features such as glass doors, drawers, carvings, cup holders or turned legs. If it is painted or upholstered, end with "Available in your choice of colour.",
 "name_sw": the same name in simple everyday Kenyan Swahili mixed with English the way Kenyans talk (keep words like "wall unit", "sofa", "TV"),
 "description_sw": the same description in simple everyday Kenyan Swahili mixed with English, short and easy to read (keep names short and simple, e.g. "Wall unit ya TV"; drop design details from the name; avoid formal or rare Swahili words Kenyans may misread, such as "tao" or "samani"; say "fanicha"); if painted or upholstered end with "Inapatikana kwa rangi unayopenda."}
Never mention price, never guess the wood species or exact dimensions. If there is no furniture in the photo, reply {"name":"","category":"custom","description":""}.`;
async function aiModel(){
 if(aiModels)return aiModels;
 const m=await import(FB_CDN+'firebase-ai.js');
 const ai=m.getAI(fb.app,{backend:new m.GoogleAIBackend()});
 const cfg={generationConfig:{responseMimeType:'application/json',temperature:0.3}};
 aiModels=[m.getGenerativeModel(ai,{model:'gemini-3.6-flash',...cfg}),m.getGenerativeModel(ai,{model:'gemini-2.5-flash',...cfg})];
 return aiModels;
}
async function suggestFromPhoto(file){
 const f=$('#pf'),hint=$('#aihint'),again=document.querySelector('[data-aiagain]');if(!f||!hint)return;
 lastPhoto=file;hint.textContent='Looking at the photo…';
 try{
  const url=await shrink(file),part={inlineData:{data:url.split(',')[1],mimeType:'image/jpeg'}};
  const models=await aiModel();let out=null,err=null;
  for(const md of models){try{const r=await md.generateContent([AI_PROMPT,part]);out=JSON.parse(r.response.text().replace(/^```(json)?|```$/g,'').trim());break}catch(x){err=x}}
  if(!out)throw err;
  if(!out.name){hint.textContent='No furniture recognised in this photo. Please type the details.';return}
  const fill=(el,v)=>{if(v&&(!el.value.trim()||el.dataset.ai==='1')){el.value=String(v).slice(0,el.maxLength>0?el.maxLength:600);el.dataset.ai='1'}};
  fill(f.name,out.name);fill(f.desc,out.description);fill(f.name_sw,out.name_sw);fill(f.desc_sw,out.description_sw);
  if(CATS.some(c=>c[0]===out.category)&&(f.cat.dataset.ai==='1'||!f.pid.value)){f.cat.value=out.category;f.cat.dataset.ai='1'}
  hint.textContent='✨ Suggested from the photo. Check the name and description, change anything that is wrong, then add the price.';
  if(again)again.hidden=false;
 }catch(x){hint.textContent='Could not suggest details right now. Please type them yourself.';if(again)again.hidden=false}
}
document.addEventListener('change',e=>{const el=e.target;if(el.name==='img'&&el.closest('#pf')&&el.files[0]&&fb)suggestFromPhoto(el.files[0])});
document.addEventListener('input',e=>{const el=e.target;if(el.closest&&el.closest('#pf')&&el.dataset.ai)delete el.dataset.ai});

async function translateSw(name,desc){
 const models=await aiModel();let err=null;
 const prompt=`Translate this furniture product listing from a Kenyan furniture shop into simple everyday Kenyan Swahili mixed with English the way Kenyans talk, as a Kenyan shop would write it. Keep names short and simple, e.g. "Wall unit ya TV". Avoid formal or rare Swahili words Kenyans may misread, such as "tao" or "samani"; say "fanicha". Keep loan words Kenyans commonly use (like "wall unit", "sofa", "TV") where they are clearer. Reply with JSON only: {"name_sw": "...", "description_sw": "..."}.
Name: ${name}
Description: ${desc||''}`;
 for(const md of models){try{const r=await md.generateContent(prompt);return JSON.parse(r.response.text().replace(/^```(json)?|```$/g,'').trim())}catch(x){err=x}}
 throw err;
}

   <div style="display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:14px" aria-label="Visits, last 14 days">${days.map(d=>`<div title="${d}: ${v[d]||0}" style="flex:1;background:#f2a516;border-radius:4px 4px 0 0;height:${Math.max(3,Math.round((v[d]||0)/mx*86))}px"></div>`).join('')}</div>
   <div class="muted" style="font-size:13px;display:flex;justify-content:space-between"><span>${days[0].slice(5)}</span><span>Visits, last 14 days</span><span>today</span></div></div>
  <div class="panel" style="margin-top:12px"><h3>Product interest</h3>${prods.length?prods.map(x=>`<div class="row"><b>${esc(x.p.name)}</b><span class="muted" style="white-space:nowrap">${x.views||0} views · ${x.wa||0} WhatsApp</span></div>`).join(''):'<p class="muted" style="margin:0">No product views yet.</p>'}</div>`;
  const revRow=(d,approved)=>{const r=d.data(),p=S.products.find(x=>x.id===r.pid);return `<div class="row" style="display:block"><div><b>${esc(r.name)}</b>${r.town?` · ${esc(r.town)}`:''} <span style="color:#f2a516">${starTxt(r.stars)}</span> <span class="muted">on ${esc(p?p.name:'a removed product')} · ${when(r.at)}</span></div><p style="margin:4px 0 8px">${esc(r.text)}</p><div class="btns">${approved?'':`<button class="btn b-acc" data-rapprove="${d.id}" style="min-height:40px">Approve</button>`}<button class="btn b-ghost" data-rdel="${d.id}" style="min-height:40px">Delete</button></div></div>`};
  S.revHTML=`<div class="sec"><h2>Reviews waiting for approval (${pend.size})</h2></div><div class="panel">${pend.size?pend.docs.map(d=>revRow(d,false)).join(''):'<p class="muted" style="margin:0">None waiting.</p>'}</div>
  <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;padding:8px 0">Published reviews (${appr.size})</summary><div class="panel">${appr.size?appr.docs.map(d=>revRow(d,true)).join(''):'<p class="muted" style="margin:0">None yet.</p>'}</div></details>`;
  S.fbkHTML=`<div class="sec"><h2>Private customer comments (${fs.size})</h2></div><div class="panel">${fs.size?fs.docs.map(d=>{const c=d.data();return `<div class="row" style="display:block"><div><b>${esc(c.name||'Anonymous')}</b>${c.contact?` · ${esc(c.contact)}`:''} <span class="muted">· ${when(c.at)}</span></div><p style="margin:4px 0 8px;white-space:pre-line">${esc(c.text)}</p><button class="btn b-ghost" data-fdel="${d.id}" style="min-height:40px">Delete</button></div>`}).join(''):'<p class="muted" style="margin:0">No comments yet.</p>'}</div>`;
 }catch(x){S.statsHTML=`<p class="muted">Could not load stats: ${esc(errMsg(x))}</p>`}
 const a=$('#adminextra');if(a)a.innerHTML=S.statsHTML+S.revHTML+S.fbkHTML;
}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-rapprove],[data-rdel],[data-fdel],[data-reload-admin]');if(!t||!fb)return;const d=t.dataset;
 try{
  if(d.rapprove){await setDoc(doc(fb.db,'reviews',d.rapprove),{status:'approved'},{merge:true});logAct('approved a review');toast('Review published')}
  else if(d.rdel){await deleteDoc(doc(fb.db,'reviews',d.rdel));logAct('deleted a review');toast('Review deleted')}
  else if(d.fdel){await deleteDoc(doc(fb.db,'feedback',d.fdel));toast('Comment deleted')}
  loadAdmin();
 }catch(x){toast(errMsg(x))}
});

const priceFromForm=f=>f.pmode.value==='set'?(parseInt(String(f.kes.value).replace(/[^0-9]/g,''),10)||0):0;
function setPriceForm(f,k){f.pmode.value=k>0?'set':'ask';f.kes.disabled=!(k>0);f.kes.value=k>0?Number(k).toLocaleString('en-KE'):''}
document.addEventListener('change',e=>{const el=e.target;if(el.name==='pmode'&&el.form&&el.form.id==='pf'){const f=el.form;f.kes.disabled=f.pmode.value!=='set';if(!f.kes.disabled)f.kes.focus();else f.kes.value=''}});
document.addEventListener('input',e=>{const el=e.target;if(el.name==='kes'&&el.form&&el.form.id==='pf'){const d=el.value.replace(/[^0-9]/g,'');el.value=d?Number(d).toLocaleString('en-KE'):''}});
document.addEventListener('reset',e=>{const f=e.target;if(f.id==='pf')setTimeout(()=>{f.kes.disabled=true;f.kes.value=''},0)});
const route=()=>{const h=location.hash;if(h==='#manage')return go('manage');
 let m=h.match(/^#p=(.+)$/);if(m){go('item',{item:decodeURIComponent(m[1])});return}
 m=h.match(/^#idea=(.+)$/);if(m){const i=IDEAS.findIndex(x=>x[0]===decodeURIComponent(m[1]));go('home');if(i>=0)openIdea(i)}};
addEventListener('hashchange',route);route();

render();
}
</script>
</body>
</html>
