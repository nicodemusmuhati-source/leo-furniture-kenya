<style>
/* VOICE: a confident local workshop showroom — warm, proud, easy for anyone to use
   IDEA: a carpenter's catalogue card — each piece on a wooden plank shelf
   PICTURE: illustrated furniture pieces on timber-toned panels; logo of wood rings
   COLOUR and TYPE: walnut #3b2416 dominant, white ground, saffron #f2a516 accent; Archivo 800 + Archivo
   LAYOUT: phone app — top bar, scrolling content, bottom tab bar */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#1a110b);--ink:light-dark(#231710,#f6eee6);--soft:light-dark(#6b5848,#c9b7a6);
--wal:light-dark(#3b2416,#2a1a10);--wal2:light-dark(#5a3a24,#4a2f1d);--card:light-dark(#f7f1ea,#26190f);
--line:light-dark(#e6d9cb,#3d2a1b);--acc:#f2a516;--ok:#1e8a4c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
h1,h2,h3{font-weight:800;line-height:1.08;text-wrap:balance;margin:0 0 8px}
h1{font-size:clamp(30px,8vw,46px)}h2{font-size:24px}h3{font-size:18px}
a{color:inherit}
button,input,select,textarea{font:inherit;font-size:16px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--wal);color:#fff;display:flex;align-items:center;gap:10px;padding:10px max(4vw,14px)}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:1}
.top b{font-weight:800;font-size:19px;letter-spacing:-.3px}
.top small{display:block;font-size:12px;opacity:.8}
.cur{background:transparent;border:1.5px solid #ffffff66;color:#fff;border-radius:99px;padding:8px 14px;min-height:40px}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(4vw,14px)}
.hero{background:var(--wal);color:#fff;padding:22px max(4vw,14px) 26px;display:grid;gap:16px}
.hero p{margin:0;opacity:.9;max-width:36em}
.hero .art{border-radius:18px;overflow:hidden;background:var(--wal2);aspect-ratio:16/10}
.hero .art svg{width:100%;height:100%;display:block}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;font-weight:600;text-decoration:none}
.b-acc{background:var(--acc);color:#231710}.b-wa{background:var(--ok);color:#fff}
.b-ghost{background:transparent;border:1.5px solid currentColor;color:inherit}
.b-wal{background:var(--wal);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 15px;min-height:44px}
.chip.on{background:var(--wal);color:#fff;border-color:var(--wal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;color:var(--ink);padding:0}
.card .pic{aspect-ratio:4/3;background:var(--wal2);overflow:hidden}
.card .pic svg,.card .pic img{width:100%;height:100%;object-fit:cover;display:block}.card .pic img,.detail .pic img{object-fit:contain!important;background:#ece5dc}
.card .bd{padding:12px 14px 14px;display:grid;gap:4px}
.price{font-weight:800;white-space:nowrap}
.muted{color:var(--soft);font-size:14px}
.cat{padding:14px;display:grid;gap:6px;min-height:110px;align-content:end;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-align:left}
.cat svg{width:56px;height:40px}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec a,.link{color:var(--soft);font-size:15px;background:none;border:0;text-decoration:underline;padding:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.steps{margin:0;padding-left:1.3em;display:grid;gap:6px}
.detail{display:grid;gap:18px}
@media(min-width:760px){.detail{grid-template-columns:1.1fr 1fr}.hero{grid-template-columns:1fr 1fr;align-items:center;padding:36px 5vw}}
.detail .pic{border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--wal2)}
.detail .pic svg,.detail .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;color:var(--soft);padding:8px 2px 10px;min-height:62px;display:grid;justify-items:center;gap:2px;font-size:13px;position:relative}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--acc);color:#231710;border-radius:99px;font-size:12px;font-weight:800;padding:0 6px}
label{display:grid;gap:4px;font-weight:600;font-size:15px}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);color:var(--ink);width:100%}
form{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--wal);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}.modal .panel{max-width:380px;width:100%;background:var(--bg)}
.note{font-size:13px;color:var(--soft)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let S={view:'home',cat:'all',item:null,q:'',
 products:DEF.slice(),cur:load('leo_cur','KES'),rate:load('leo_rate',129),list:load('leo_list',[])};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=k=>!SHOW_PRICES||!k?'Ask for price':S.cur==='KES'?'KES '+Math.round(k).toLocaleString('en-KE'):'US$ '+Math.round(k/S.rate).toLocaleString('en-US');
const catName=c=>(CATS.find(x=>x[0]===c)||[,'Other'])[1];
const pic=p=>p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:svg(p.cat);
const wa=t=>`https://wa.me/${PHONE}?text=${encodeURIComponent(t)}`;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)};
const card=p=>`<button class="card" data-item="${p.id}"><div class="pic">${pic(p)}</div><div class="bd"><span class="muted">${catName(p.cat)}</span><h3>${esc(p.name)}</h3><span class="price">${money(p.kes)}</span></div></button>`;
const listCount=()=>S.list.reduce((a,x)=>a+x.q,0);

function tabs(){
 const n=listCount();
 $('#tabs').innerHTML=[['home','Home'],['shop','Shop'],['list','My list'],['contact','Contact']].map(([v,l])=>
  `<button data-go="${v}" class="${S.view===v||(v==='shop'&&S.view==='item')?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${ICON[v]}</svg>${l}${v==='list'&&n?`<span class="badge">${n}</span>`:''}</button>`).join('');
 $('#cur').textContent=S.cur;$('#cur').hidden=!SHOW_PRICES;
}

const V={
home:()=>`<section class="hero"><div><h1>Furniture made by hand in Serem, delivered across Kenya</h1>
 <p>Wall units, kitchen cabinets, classic tables, executive couches and full interior design by Vincent and the Leo Furniture workshop.</p>
 <div class="btns" style="margin-top:16px"><button class="btn b-acc" data-go="shop">Browse furniture</button><a class="btn b-wa" href="${wa('Hello Vincent, I found Leo Furniture on the app and would like to ask about furniture.')}" target="_blank" rel="noopener">WhatsApp Vincent</a></div></div>
 <div class="art">${svg('couch','#5a3a24')}</div></section>
 <div class="wrap"><div class="sec"><h2>What we make</h2></div>
 <div class="cards2">${CATS.map(([c,n])=>`<button class="cat" data-cat="${c}"><svg viewBox="40 30 240 150">${ART[c]}</svg><b>${n}</b></button>`).join('')}</div>
 <div class="sec"><h2>Popular pieces</h2><button class="link" data-go="shop">See all</button></div>
 <div class="grid">${S.products.slice(0,4).map(card).join('')}</div>
 <div class="sec"><h2>We deliver to</h2></div>
 <div class="panel"><p style="margin:0">Serem · Kapsabet · Kisumu · Kakamega · Eldoret · Nakuru · Nairobi, and anywhere in Kenya. Ask Vincent for the delivery cost to your town.</p></div>
 </div>`,

shop:()=>{const q=S.q.toLowerCase();const ps=S.products.filter(p=>(S.cat==='all'||p.cat===S.cat)&&(!q||(p.name+p.desc).toLowerCase().includes(q)));
 return `<div class="wrap"><h1 style="font-size:32px">Shop</h1>
 <input id="q" type="search" placeholder="Search e.g. couch, kitchen, table" value="${esc(S.q)}" aria-label="Search furniture" style="margin:6px 0 12px">
 <div class="chips">${[['all','All'],...CATS].map(([c,n])=>`<button class="chip ${S.cat===c?'on':''}" data-cat="${c}">${n}</button>`).join('')}</div>
 ${ps.length?`<div class="grid">${ps.map(card).join('')}</div>`:`<div class="panel"><b>Photos coming soon.</b><p class="muted" style="margin:4px 0 10px">Vincent makes ${S.cat==='all'?'custom furniture':catName(S.cat).toLowerCase()} to order. Ask him on WhatsApp for photos of his work.</p><a class="btn b-wa" href="${wa('Hello Vincent, I am looking for: '+(S.q||(S.cat==='all'?'custom furniture':catName(S.cat))))}" target="_blank" rel="noopener">Ask on WhatsApp</a></div>`}</div>`},

item:()=>{const p=S.products.find(x=>x.id===S.item);if(!p)return V.shop();
 const msg=`Hello Vincent, I am interested in the ${p.name}${SHOW_PRICES&&p.kes?` (${money(p.kes)})`:''} from the Leo Furniture app. Please share details and delivery cost to my town: `;
 return `<div class="wrap"><button class="link" data-go="shop" style="padding-left:0">← Back to shop</button>
 <div class="detail"><div class="pic">${pic(p)}</div><div style="display:grid;gap:12px;align-content:start">
 <span class="muted">${catName(p.cat)}</span><h1 style="font-size:32px">${esc(p.name)}</h1>
 <span class="price" style="font-size:24px">${money(p.kes)}</span>
 <p style="margin:0">${esc(p.desc)}</p><p class="muted" style="margin:0">Size: ${esc(p.size)} · Colours, wood and fabric can be changed to your taste.</p>
 <div class="btns"><a class="btn b-wa" href="${wa(msg)}" target="_blank" rel="noopener">Order on WhatsApp</a><button class="btn b-acc" data-add="${p.id}">Add to my list</button></div>
 <div class="panel"><h3>How to pay with M-Pesa</h3><ol class="steps"><li>Agree the final price and delivery cost with Vincent on WhatsApp first.</li><li>Open M-PESA → <b>Send Money</b>.</li><li>Enter <b style="white-space:nowrap">${MPESA}</b> (Vincent, Leo Furniture).</li><li>Enter the agreed amount and your PIN.</li><li>Send the M-Pesa confirmation message to Vincent on WhatsApp.</li></ol></div>
 </div></div></div>`},

list:()=>{const rows=S.list.map(x=>({...x,p:S.products.find(p=>p.id===x.id)})).filter(x=>x.p);
 const tot=rows.reduce((a,x)=>a+(x.p.kes||0)*x.q,0), quote=rows.some(x=>!x.p.kes);
 const msg='Hello Vincent, I would like to order from Leo Furniture:\n'+rows.map(x=>`• ${x.q} × ${x.p.name}`).join('\n')+(SHOW_PRICES?`\nEstimated total: ${money(tot)}${quote?' + quoted items':''}`:'\nPlease send me the prices.')+`\nMy name and town: `;
 return `<div class="wrap"><h1 style="font-size:32px">My list</h1>
 ${rows.length?`<div class="panel">${rows.map(x=>`<div class="row"><div><b>${esc(x.p.name)}</b><div class="muted">${money(x.p.kes)}</div></div><div class="qty"><button data-q="${x.id}" data-d="-1" aria-label="Less">−</button><b>${x.q}</b><button data-q="${x.id}" data-d="1" aria-label="More">+</button></div></div>`).join('')}
 ${SHOW_PRICES?`<div class="row"><b>Estimated total</b><span class="price">${money(tot)}${quote?' + quotes':''}</span></div>`:''}</div>
 <p class="muted">Delivery cost depends on your town and is confirmed by Vincent.</p>
 <div class="btns"><a class="btn b-wa" href="${wa(msg)}" target="_blank" rel="noopener">Send order on WhatsApp</a><button class="btn b-ghost" data-clear>Clear list</button></div>`
 :`<div class="panel"><b>Your list is empty.</b><p class="muted" style="margin:4px 0 12px">Add pieces you like, then send them all to Vincent in one WhatsApp message.</p><button class="btn b-wal" data-go="shop">Browse furniture</button></div>`}</div>`},

contact:()=>`<div class="wrap"><h1 style="font-size:32px">Talk to Vincent</h1>
 <div class="panel" style="display:grid;gap:10px"><p style="margin:0">For orders, custom designs, interior design and delivery quotes, call or WhatsApp:</p>
 <p class="price" style="font-size:22px;margin:0">+254 729 754 199</p>
 <div class="btns"><a class="btn b-wa" href="${wa('Hello Vincent, ')}" target="_blank" rel="noopener">WhatsApp</a><a class="btn b-wal" href="tel:+254729754199">Call</a></div>
 <p class="note" style="margin:0">M-Pesa payments: Send Money to ${MPESA}. Workshop: Serem Town, Nandi County.</p></div>
 <div class="sec"><h2>Request a custom piece or interior design</h2></div>
 <form class="panel" id="req"><label>Your name<input name="n" required autocomplete="name"></label>
 <label>Your town<input name="t" required placeholder="e.g. Kisumu"></label>
 <label>What do you need?<select name="c">${CATS.map(([,n])=>`<option>${n}</option>`).join('')}</select></label>
 <label>Describe it (size, colour, budget)<textarea name="d" rows="4"></textarea></label>
 <button class="btn b-wa">Send request on WhatsApp</button><p class="note" style="margin:0">This opens WhatsApp with your message ready. Tap send there.</p></form>
 </div>`
};

function go(v,extra){Object.assign(S,{view:v},extra||{});if(v!=='manage'&&location.hash==='#manage')history.replaceState(null,'',location.pathname+location.search);render();scrollTo(0,0)}
function render(){
 app.innerHTML=V[S.view]();tabs();
 const q=$('#q');if(q)q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
}
const addList=id=>{const x=S.list.find(i=>i.id===id);x?x.q++:S.list.push({id,q:1});save('leo_list',S.list);toast('Added to your list');tabs()};
function modal(html){$('#mbody').innerHTML=html;$('#modal').classList.add('show')}
const closeModal=()=>$('#modal').classList.remove('show');

document.addEventListener('click',e=>{
 const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
 if(d.go){e.preventDefault();go(d.go)}
 else if(d.cat){go('shop',{cat:d.cat})}
 else if(d.item){go('item',{item:d.item})}
 else if(d.add)addList(d.add);
 else if(d.q){const x=S.list.find(i=>i.id===d.q);x.q+=+d.d;S.list=S.list.filter(i=>i.q>0);save('leo_list',S.list);render()}
 else if('clear' in d){S.list=[];save('leo_list',S.list);render()}
 else if(t.id==='cur'){S.cur=S.cur==='KES'?'USD':'KES';save('leo_cur',S.cur);render();toast('Prices in '+(S.cur==='KES'?'Kenya shillings':'US dollars (approximate)'))}
 else if('close' in d)closeModal();
});
document.addEventListener('submit',async e=>{
 const f=e.target;if(f.id!=='req')return;e.preventDefault();
 if(f.id==='req'){const m=`Hello Vincent, my name is ${f.n.value} from ${f.t.value}. I need: ${f.c.value}.\n${f.d.value}`;
  const a=document.createElement('a');a.href=wa(m);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
/* ===== Secure management (Firebase) ===== */
const ADMIN='nicodemusmuhati@gmail.com', DOMAIN='users.leofurniture.app';
let fb=null;
if(CFG.apiKey&&initializeApp){const fapp=initializeApp(CFG);fb={app:fapp,auth:getAuth(fapp),db:getFirestore(fapp)}}
Object.assign(S,{user:null,role:null,live:false,remote:0,pinOn:null,editors:[],logs:[],editing:null,busy:false});
const isGoogleAdmin=()=>S.role==='admin';
const label=()=>S.user?(S.user.email&&S.user.email.endsWith('@'+DOMAIN)?'Owner PIN':S.user.email):'';
const errMsg=e=>{const c=e&&e.code||'';
 if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return 'Wrong PIN.';
 if(/too-many-requests/.test(c))return 'Too many tries. Wait a few minutes, then try again.';
 if(/popup-closed|cancelled-popup/.test(c))return 'Sign-in was cancelled.';
 if(/popup-blocked/.test(c))return 'Allow pop-ups for this site, then try again.';
 if(/permission-denied/.test(c))return 'Not allowed. PIN logins may be paused, or this login is inactive.';
 if(/email-already-in-use/.test(c))return 'That username is taken. Choose another.';
 if(/requires-recent-login/.test(c))return 'For safety, sign out, sign in again, then change your PIN.';
 if(/weak-password/.test(c))return 'PIN must be at least 6 digits.';
 return 'Something went wrong. Check your connection and try again.'};
const busy=(on)=>{S.busy=on;document.querySelectorAll('#app button').forEach(b=>b.disabled=on)};
const logAct=(action,product)=>addDoc(collection(fb.db,'log'),{uid:S.user.uid,who:label(),action,product:product||'',at:serverTimestamp()}).catch(()=>{});

/* live product list for every visitor */
if(fb){
 onSnapshot(query(collection(fb.db,'products'),orderBy('order')),snap=>{
  S.live=true;S.remote=snap.size;
  if(snap.size)S.products=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(S.view==='manage'){const l=$('#plist');if(l)l.innerHTML=prodRows();const s=$('#seed');if(s)s.hidden=!(isGoogleAdmin()&&S.remote===0)}
  else render();
 },()=>{});
 onAuthStateChanged(fb.auth,async u=>{
  S.user=u;S.role=null;
  if(u){
   const prov=(u.providerData[0]||{}).providerId;
   if(prov==='google.com'){
    if(u.email===ADMIN&&u.emailVerified)S.role='admin';
    else{await signOut(fb.auth);toast('This Google account is not allowed.');return}
   }else{
    try{
     const [c,ed]=await Promise.all([getDoc(doc(fb.db,'config','security')),getDoc(doc(fb.db,'editors',u.uid))]);
     if(!ed.exists()||!ed.data().active){await signOut(fb.auth);toast('This login is not active.');return}
     if(!c.exists()||!c.data().pinLoginEnabled){await signOut(fb.auth);toast('PIN logins are paused by the admin.');return}
     S.role=ed.data().role==='admin'?'admin-pin':'editor';
    }catch(err){await signOut(fb.auth);toast(errMsg(err));return}
   }
   if(isGoogleAdmin())loadSecurity();
  }
  if(S.view==='manage')render();
 });
}
async function loadSecurity(){
 try{
  const c=await getDoc(doc(fb.db,'config','security'));S.pinOn=c.exists()?!!c.data().pinLoginEnabled:false;
  const es=await getDocs(collection(fb.db,'editors'));S.editors=es.docs.map(d=>({uid:d.id,...d.data()}));
  const ls=await getDocs(query(collection(fb.db,'log'),orderBy('at','desc'),limit(30)));S.logs=ls.docs.map(d=>d.data());
 }catch(e){toast(errMsg(e))}
 const s=$('#sec');if(s)s.innerHTML=secHTML();
}

const prodRows=()=>S.products.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="muted">${catName(p.cat)}${p.kes?' · KES '+Number(p.kes).toLocaleString('en-KE'):''}</div></div><div class="btns"><button class="btn b-ghost" data-pedit="${p.id}" style="min-height:40px">Edit</button><button class="btn b-ghost" data-pdel="${p.id}" style="min-height:40px">Delete</button></div></div>`).join('')||'<p class="muted">No products yet.</p>';

const secHTML=()=>`<div class="sec"><h2>Security</h2></div>
 <div class="panel" style="display:grid;gap:10px">
  <p style="margin:0"><b>PIN logins are ${S.pinOn?'ON':'PAUSED'}.</b> ${S.pinOn?'Anyone with a valid username and PIN can edit products.':'Only your Google sign-in can make changes right now.'}</p>
  <div class="btns"><button class="btn ${S.pinOn?'b-wal':'b-acc'}" data-pintoggle>${S.pinOn?'Pause all PIN logins':'Turn PIN logins on'}</button></div>
 </div>
 <div class="sec"><h2>Owner PIN</h2></div>
 <form class="panel" id="nf"><p style="margin:0 0 4px">${S.editors.some(x=>x.active)?'An owner PIN is set. Setting a new one cancels the old PIN straight away.':'No owner PIN yet. Set one so you and Vincent can sign in with it.'}</p>
  <label>New owner PIN (at least 6 digits)<input name="p" type="password" inputmode="numeric" pattern="[0-9]{6,12}" required autocomplete="new-password"></label>
  <label>Repeat PIN<input name="p2" type="password" inputmode="numeric" pattern="[0-9]{6,12}" required autocomplete="new-password"></label>
  <button class="btn b-wal">Set owner PIN</button>
  <p class="note" style="margin:0">Share the PIN with Vincent by phone call or in person, not in a group chat.</p></form>
 <div class="sec"><h2>Recent activity</h2></div>
 <div class="panel">${S.logs.map(l=>`<div class="row"><span>${esc(l.who)} ${esc(l.action)} <b>${esc(l.product)}</b></span><span class="muted" style="white-space:nowrap">${l.at&&l.at.toDate?l.at.toDate().toLocaleDateString('en-GB'):''}</span></div>`).join('')||'<p class="muted" style="margin:0">No activity yet.</p>'}</div>`;

V.manage=()=>{
 if(!fb)return `<div class="wrap"><div class="panel"><b>Not connected yet.</b></div></div>`;
 if(!S.user||!S.role)return `<div class="wrap" style="max-width:460px"><h1 style="font-size:32px">Sign in</h1>
  <div class="panel" style="display:grid;gap:12px"><button class="btn b-wal" data-gin>Sign in with Google</button></div>
  <form class="panel" id="pinf" style="margin-top:12px"><label>Owner PIN<input name="p" type="password" inputmode="numeric" required autocomplete="current-password"></label>
  <button class="btn b-acc">Sign in with PIN</button></form></div>`;
 return `<div class="wrap"><div class="row" style="border:0"><div><h1 style="font-size:32px;margin:0">Manage products</h1><span class="muted">Signed in as ${esc(label())} (${S.role==='admin'?'admin, Google':'owner PIN'})</span></div><button class="btn b-ghost" data-sout>Sign out</button></div>
 <form class="panel" id="pf"><h2 id="ft">${S.editing?'Edit product':'Add a product'}</h2><input type="hidden" name="pid">
  <label>Name<input name="name" required maxlength="80"></label>
  <label>Category<select name="cat">${CATS.map(([c,n])=>`<option value="${c}">${n}</option>`).join('')}</select></label>
  <label>Size<input name="size" maxlength="80" placeholder="e.g. 2.4 m × 1.8 m"></label>
  <label>Description<textarea name="desc" rows="3" maxlength="600"></textarea></label>
  <label>Price in KES (hidden from customers for now; 0 = ask for price)<input name="kes" type="number" min="0" step="500" inputmode="numeric" value="0"></label>
  <label>Photo<input name="img" type="file" accept="image/*"></label>
  <div class="btns"><button class="btn b-acc">Save product</button><button type="button" class="btn b-ghost" data-pnew>Clear form</button></div></form>
 <div class="sec"><h2>Products</h2><button class="btn b-ghost" id="seed" data-seed ${isGoogleAdmin()&&S.live&&S.remote===0?'':'hidden'}>Load starter products</button></div>
 <div class="panel" id="plist">${prodRows()}</div>
 ${S.role!=='admin'?`<form class="panel" id="cp" style="margin-top:16px"><h3>Change the owner PIN</h3><label>New PIN (at least 6 digits)<input name="p" type="password" inputmode="numeric" pattern="[0-9]{6,12}" required autocomplete="new-password"></label><label>Repeat new PIN<input name="p2" type="password" inputmode="numeric" pattern="[0-9]{6,12}" required autocomplete="new-password"></label><button class="btn b-wal">Change PIN</button></form>`:''}
 ${isGoogleAdmin()?`<div id="sec">${secHTML()}</div>`:''}</div>`;
};
const shrink=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.75,u=c.toDataURL('image/jpeg',q);while(u.length>850000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}res(u)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)});

document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t||!fb)return;const d=t.dataset;
 try{
  if('gin' in d){await signInWithPopup(fb.auth,new GoogleAuthProvider())}
  else if('sout' in d){await signOut(fb.auth);S.editing=null;render()}
  else if('pnew' in d){S.editing=null;$('#pf').reset();$('#pf').pid.value='';$('#ft').textContent='Add a product'}
  else if(d.pedit){const p=S.products.find(x=>x.id===d.pedit),f=$('#pf');S.editing=p.id;f.pid.value=p.id;f.name.value=p.name;f.cat.value=p.cat;f.size.value=p.size||'';f.desc.value=p.desc||'';f.kes.value=p.kes||0;$('#ft').textContent='Edit: '+p.name;f.scrollIntoView({behavior:'smooth'})}
  else if(d.pdel){const p=S.products.find(x=>x.id===d.pdel);modal(`<h2>Delete ${esc(p.name)}?</h2><p class="muted">Customers will no longer see it.</p><div class="btns"><button class="btn b-wal" data-preally="${p.id}">Delete</button><button class="btn b-ghost" data-close>Keep</button></div>`)}
  else if(d.preally){const p=S.products.find(x=>x.id===d.preally);closeModal();await deleteDoc(doc(fb.db,'products',d.preally));logAct('deleted',p&&p.name);toast('Product deleted')}
  else if('seed' in d){busy(true);let i=1;for(const p of DEF){const {id,...rest}=p;await setDoc(doc(fb.db,'products',id),{...rest,order:i++,updatedAt:serverTimestamp(),updatedBy:S.user.uid})}logAct('loaded starter products');busy(false);toast('Starter products loaded')}
  else if('pintoggle' in d){await setDoc(doc(fb.db,'config','security'),{pinLoginEnabled:!S.pinOn});logAct(S.pinOn?'paused PIN logins':'turned PIN logins on');await loadSecurity();toast(S.pinOn?'PIN logins are on':'All PIN logins paused')}
  else if(d.eact){await setDoc(doc(fb.db,'editors',d.eact),{active:d.on==='1'},{merge:true});await loadSecurity();toast(d.on==='1'?'Login activated':'Login paused')}
 }catch(err){busy(false);toast(errMsg(err))}
});
document.addEventListener('submit',async e=>{
 const f=e.target;if(!['pinf','pf','nf','cp'].includes(f.id)||!fb)return;e.preventDefault();if(S.busy)return;
 try{busy(true);
  if(f.id==='pinf'){let u='owner';try{const L=await getDoc(doc(fb.db,'public','login'));if(L.exists()&&L.data().pinUser)u=L.data().pinUser}catch(x){}await signInWithEmailAndPassword(fb.auth,`${u}@${DOMAIN}`,f.p.value)}
  else if(f.id==='pf'){
   const id=f.pid.value||('p'+Date.now().toString(36)),old=S.products.find(p=>p.id===id&&f.pid.value);
   let img=old&&old.img||'';if(f.img.files[0])img=await shrink(f.img.files[0]);
   const data={name:f.name.value.trim(),cat:f.cat.value,desc:f.desc.value.trim(),size:f.size.value.trim(),kes:+f.kes.value||0,img,order:old&&typeof old.order==='number'?old.order:-Date.now(),updatedAt:serverTimestamp(),updatedBy:S.user.uid};
   await setDoc(doc(fb.db,'products',id),data);logAct(old?'edited':'added',data.name);
   S.editing=null;f.reset();f.pid.value='';$('#ft').textContent='Add a product';toast(old?'Product updated':'Product added')}
  else if(f.id==='nf'){
   if(f.p.value!==f.p2.value)throw {code:'x',m:'The two PINs do not match.'};
   const u='owner'+Date.now().toString(36),sec=initializeApp(CFG,'sec'+Date.now()),sa=getAuth(sec);
   try{const cred=await createUserWithEmailAndPassword(sa,`${u}@${DOMAIN}`,f.p.value);
    for(const x of S.editors.filter(x=>x.active))await setDoc(doc(fb.db,'editors',x.uid),{active:false},{merge:true});
    await setDoc(doc(fb.db,'editors',cred.user.uid),{username:u,role:'owner',active:true,createdAt:serverTimestamp()});
    await setDoc(doc(fb.db,'public','login'),{pinUser:u});
    logAct('set a new owner PIN');}finally{await signOut(sa).catch(()=>{});await deleteApp(sec).catch(()=>{})}
   f.reset();await loadSecurity();toast('New owner PIN is active')}
  else if(f.id==='cp'){if(f.p.value!==f.p2.value)throw {code:'x',m:'The two PINs do not match.'};await updatePassword(fb.auth.currentUser,f.p.value);logAct('changed own PIN');f.reset();toast('PIN changed')}
 }catch(err){toast(err&&err.m||errMsg(err))}finally{busy(false)}
});
const route=()=>{if(location.hash==='#manage')go('manage')};
addEventListener('hashchange',route);route();

render();
}
</script>
