<style>
/* VOICE: a confident local workshop showroom — warm, proud, easy for anyone to use
   IDEA: a carpenter's catalogue card — each piece on a wooden plank shelf
   PICTURE: illustrated furniture pieces on timber-toned panels; logo of wood rings
   COLOUR and TYPE: walnut #3b2416 dominant, white ground, saffron #f2a516 accent; Archivo 800 + Archivo
   LAYOUT: phone app — top bar, scrolling content, bottom tab bar */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#1a110b);--ink:light-dark(#231710,#f6eee6);--soft:light-dark(#6b5848,#c9b7a6);
--wal:light-dark(#3b2416,#2a1a10);--wal2:light-dark(#5a3a24,#4a2f1d);--card:light-dark(#f7f1ea,#26190f);
--line:light-dark(#e6d9cb,#3d2a1b);--acc:#f2a516;--ok:#1e8a4c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:140px}
h1,h2,h3{font-weight:800;line-height:1.08;text-wrap:balance;margin:0 0 8px}
h1{font-size:clamp(30px,8vw,46px)}h2{font-size:24px}h3{font-size:18px}
a{color:inherit}
button,input,select,textarea{font:inherit;font-size:16px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--wal);color:#fff;display:flex;align-items:center;gap:10px;padding:10px max(4vw,14px)}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:1}
.top b{font-weight:800;font-size:19px;letter-spacing:-.3px}
.top small{display:block;font-size:12px;opacity:.8}
.cur{background:transparent;border:1.5px solid #ffffff66;color:#fff;border-radius:99px;padding:8px 14px;min-height:40px}
.top .brand svg{flex:none}.top .cur{flex:none;padding:6px 10px;font-size:14px;min-height:40px}@media(max-width:400px){.top small{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(4vw,14px)}
.hero{background:var(--wal);color:#fff;padding:22px max(4vw,14px) 26px;display:grid;gap:16px}
.hero p{margin:0;opacity:.9;max-width:36em}
.hero .art{border-radius:18px;overflow:hidden;background:var(--wal2);aspect-ratio:16/10}
.hero .art svg{width:100%;height:100%;display:block}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;font-weight:600;text-decoration:none}
.b-acc{background:var(--acc);color:#231710}.b-wa{background:var(--ok);color:#fff}
.b-ghost{background:transparent;border:1.5px solid currentColor;color:inherit}
.b-wal{background:var(--wal);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 15px;min-height:44px}
.chip.on{background:var(--wal);color:#fff;border-color:var(--wal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;color:var(--ink);padding:0}
.card .pic{aspect-ratio:4/3;background:var(--wal2);overflow:hidden}
.card .pic svg,.card .pic img{width:100%;height:100%;object-fit:cover;display:block}.card .pic img,.detail .pic img{object-fit:contain!important;background:#ece5dc}
.card .bd{padding:12px 14px 14px;display:grid;gap:4px}
.price{font-weight:800;white-space:nowrap}
.muted{color:var(--soft);font-size:14px}
.cat{padding:14px;display:grid;gap:6px;min-height:110px;align-content:end;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-align:left}
.cat svg{width:56px;height:40px}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec a,.link{color:var(--soft);font-size:15px;background:none;border:0;text-decoration:underline;padding:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.steps{margin:0;padding-left:1.3em;display:grid;gap:6px}
.detail{display:grid;gap:18px}
@media(min-width:760px){.detail{grid-template-columns:1.1fr 1fr}.hero{grid-template-columns:1fr 1fr;align-items:center;padding:36px 5vw}}
.detail .pic{border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--wal2)}
.detail .pic svg,.detail .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:calc(56px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:0;color:var(--soft);padding:8px 2px 10px;min-height:62px;display:grid;justify-items:center;gap:2px;font-size:13px;position:relative}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--acc);color:#231710;border-radius:99px;font-size:12px;font-weight:800;padding:0 6px}
label{display:grid;gap:4px;font-weight:600;font-size:15px}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);color:var(--ink);width:100%}
form{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--wal);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}.modal .panel{max-width:380px;width:100%;background:var(--bg)}
.note{font-size:13px;color:var(--soft)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

const errMsg=e=>{const c=e&&e.code||'';
 if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return 'Wrong PIN.';
 if(/too-many-requests/.test(c))return 'Too many tries. Wait a few minutes, then try again.';
 if(/popup-closed|cancelled-popup/.test(c))return 'Sign-in was cancelled.';
 if(/popup-blocked/.test(c))return 'Allow pop-ups for this site, then try again.';
 if(/permission-denied/.test(c))return 'Not allowed. PIN logins may be paused, or this login is inactive.';
 if(/email-already-in-use/.test(c))return 'That username is taken. Choose another.';
 if(/requires-recent-login/.test(c))return 'For safety, sign out, sign in again, then change your PIN.';
 if(/weak-password/.test(c))return 'PIN must be at least 6 digits.';
 return 'Something went wrong. Check your connection and try again.'};

  if(S.view==='manage'){const l=$('#plist');if(l)l.innerHTML=prodRows();const s=$('#seed');if(s)s.hidden=!missingStarters().length}
  else render();
 },()=>{});
 onAuthStateChanged(fb.auth,async u=>{
  S.user=u;S.role=null;
  if(u){
   const prov=(u.providerData[0]||{}).providerId;
   if(prov==='google.com'){
    if(u.email===ADMIN&&u.emailVerified)S.role='admin';
    else{await signOut(fb.auth);toast('This Google account is not allowed.');return}
   }else{
    try{
     const [c,ed]=await Promise.all([getDoc(doc(fb.db,'config','security')),getDoc(doc(fb.db,'editors',u.uid))]);
     if(!ed.exists()||!ed.data().active){await signOut(fb.auth);toast('This login is not active.');return}
     if(!c.exists()||!c.data().pinLoginEnabled){await signOut(fb.auth);toast('PIN logins are paused by the admin.');return}
     S.role=ed.data().role==='admin'?'admin-pin':'editor';
    }catch(err){await signOut(fb.auth);toast(errMsg(err));return}
   }
   if(isGoogleAdmin())loadSecurity();
  }
  if(S.view==='manage')render();
 });
}
async function loadSecurity(){
 try{
  const c=await getDoc(doc(fb.db,'config','security'));S.pinOn=c.exists()?!!c.data().pinLoginEnabled:false;
  const es=await getDocs(collection(fb.db,'editors'));S.editors=es.docs.map(d=>({uid:d.id,...d.data()}));
  const ls=await getDocs(query(collection(fb.db,'log'),orderBy('at','desc'),limit(30)));S.logs=ls.docs.map(d=>d.data());
 }catch(e){toast(errMsg(e))}
 const s=$('#sec');if(s)s.innerHTML=secHTML();
}

const shrink=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.75,u=c.toDataURL('image/jpeg',q);while(u.length>850000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}res(u)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)});

document.addEventListener('click',async e=>{

  else if('pnew' in d){S.editing=null;$('#pf').reset();$('#pf').pid.value='';$('#ft').textContent='Add a product'}
  else if(d.pedit){const p=S.products.find(x=>x.id===d.pedit),f=$('#pf');S.editing=p.id;f.pid.value=p.id;f.name.value=p.name;f.cat.value=p.cat;f.size.value=p.size||'';f.desc.value=p.desc||'';f.name_sw.value=p.name_sw||'';f.desc_sw.value=p.desc_sw||'';f.kes.value=p.kes||0;$('#ft').textContent='Edit: '+p.name;f.scrollIntoView({behavior:'smooth'})}
  else if(d.pdel){const p=S.products.find(x=>x.id===d.pdel);modal(`<h2>Delete ${esc(p.name)}?</h2><p class="muted">Customers will no longer see it.</p><div class="btns"><button class="btn b-wal" data-preally="${p.id}">Delete</button><button class="btn b-ghost" data-close>Keep</button></div>`)}
  else if(d.preally){const p=S.products.find(x=>x.id===d.preally);closeModal();await deleteDoc(doc(fb.db,'products',d.preally));logAct('deleted',p&&p.name);toast('Product deleted')}
  else if('seed' in d){busy(true);for(const p of missingStarters()){const {id,...rest}=p;await setDoc(doc(fb.db,'products',id),{...rest,order:DEF.indexOf(p)+1,updatedAt:serverTimestamp(),updatedBy:S.user.uid})}logAct('restored original products');busy(false);toast('Original photos restored')}
  else if('pintoggle' in d){await setDoc(doc(fb.db,'config','security'),{pinLoginEnabled:!S.pinOn});logAct(S.pinOn?'paused PIN logins':'turned PIN logins on');await loadSecurity();toast(S.pinOn?'PIN logins are on':'All PIN logins paused')}
  else if(d.eact){await setDoc(doc(fb.db,'editors',d.eact),{active:d.on==='1'},{merge:true});await loadSecurity();toast(d.on==='1'?'Login activated':'Login paused')}
 }catch(err){busy(false);toast(errMsg(err))}
});

 const f=e.target;if(!['pinf','pf','nf','cp'].includes(f.id)||!fb)return;e.preventDefault();if(S.busy)return;
 try{busy(true);
  if(f.id==='pinf'){let u='owner';try{const L=await getDoc(doc(fb.db,'public','login'));if(L.exists()&&L.data().pinUser)u=L.data().pinUser}catch(x){}await signInWithEmailAndPassword(fb.auth,`${u}@${DOMAIN}`,f.p.value)}
  else if(f.id==='pf'){
   const id=f.pid.value||('p'+Date.now().toString(36)),old=S.products.find(p=>p.id===id&&f.pid.value);
   let img=old&&old.img||'';if(f.img.files[0])img=await shrink(f.img.files[0]);
   if((!f.name_sw.value.trim()||!f.desc_sw.value.trim())&&f.name.value.trim()){try{const t=await translateSw(f.name.value,f.desc.value);if(!f.name_sw.value.trim())f.name_sw.value=t.name_sw||'';if(!f.desc_sw.value.trim())f.desc_sw.value=t.description_sw||''}catch(x){}}
   const data={name:f.name.value.trim(),name_sw:f.name_sw.value.trim().slice(0,80),desc_sw:f.desc_sw.value.trim().slice(0,600),cat:f.cat.value,desc:f.desc.value.trim(),size:f.size.value.trim(),kes:+f.kes.value||0,img,order:old&&typeof old.order==='number'?old.order:-Date.now(),updatedAt:serverTimestamp(),updatedBy:S.user.uid};
   await setDoc(doc(fb.db,'products',id),data);logAct(old?'edited':'added',data.name);
   S.editing=null;f.reset();f.pid.value='';$('#ft').textContent='Add a product';toast(old?'Product updated':'Product added')}
  else if(f.id==='nf'){
   if(f.p.value!==f.p2.value)throw {code:'x',m:'The two PINs do not match.'};
   const u='owner'+Date.now().toString(36),sec=initializeApp(CFG,'sec'+Date.now()),sa=getAuth(sec);
   try{const cred=await createUserWithEmailAndPassword(sa,`${u}@${DOMAIN}`,f.p.value);
    for(const x of S.editors.filter(x=>x.active))await setDoc(doc(fb.db,'editors',x.uid),{active:false},{merge:true});
    await setDoc(doc(fb.db,'editors',cred.user.uid),{username:u,role:'owner',active:true,createdAt:serverTimestamp()});
    await setDoc(doc(fb.db,'public','login'),{pinUser:u});
    logAct('set a new owner PIN');}finally{await signOut(sa).catch(()=>{});await deleteApp(sec).catch(()=>{})}
   f.reset();await loadSecurity();toast('New owner PIN is active')}
  else if(f.id==='cp'){if(f.p.value!==f.p2.value)throw {code:'x',m:'The two PINs do not match.'};await updatePassword(fb.auth.currentUser,f.p.value);logAct('changed own PIN');f.reset();toast('PIN changed')}
 }catch(err){toast(err&&err.m||errMsg(err))}finally{busy(false)}
});

/* ===== AI photo suggestions (Gemini via Firebase AI Logic) ===== */
let aiModels=null,lastPhoto=null;
const AI_PROMPT=`You help Leo Furniture, a furniture workshop in Serem, Kenya, list products in its online shop.
Look at the photo and identify the main furniture piece. Reply with JSON only:
{"name": short product name a Kenyan furniture shop would use, 2 to 6 words, sentence case (e.g. "Classic coffee table", "Arched TV wall unit", "7-seater L-shaped sofa"),
 "category": exactly one of "wall","kitchen","table","coffee","couch","interior","custom"
   (wall = TV wall units and display cabinets; kitchen = kitchen cabinets; table = dining tables, office desks and other big tables;
    coffee = coffee tables and side tables; couch = sofas, couches and armchairs; interior = a finished room or interior design work;
    custom = beds, wardrobes, doors, shelves, school or church furniture and anything else),
 "description": 2 sentences, at most 350 characters, in plain friendly English, describing what a buyer can see: type, style, colour or finish, and features such as glass doors, drawers, carvings, cup holders or turned legs. If it is painted or upholstered, end with "Available in your choice of colour.",
 "name_sw": the same name in natural Kenyan Swahili as a Kenyan furniture shop would write it (keep loan words Kenyans use, like "wall unit", "sofa" or "TV", where clearer),
 "description_sw": the same description in natural, simple Kenyan Swahili; if painted or upholstered end with "Inapatikana kwa rangi unayopenda."}
Never mention price, never guess the wood species or exact dimensions. If there is no furniture in the photo, reply {"name":"","category":"custom","description":""}.`;
async function aiModel(){
 if(aiModels)return aiModels;
 const m=await import(FB_CDN+'firebase-ai.js');
 const ai=m.getAI(fb.app,{backend:new m.GoogleAIBackend()});
 const cfg={generationConfig:{responseMimeType:'application/json',temperature:0.3}};
 aiModels=[m.getGenerativeModel(ai,{model:'gemini-3.6-flash',...cfg}),m.getGenerativeModel(ai,{model:'gemini-2.5-flash',...cfg})];
 return aiModels;
}
async function suggestFromPhoto(file){
 const f=$('#pf'),hint=$('#aihint'),again=document.querySelector('[data-aiagain]');if(!f||!hint)return;
 lastPhoto=file;hint.textContent='Looking at the photo…';
 try{
  const url=await shrink(file),part={inlineData:{data:url.split(',')[1],mimeType:'image/jpeg'}};
  const models=await aiModel();let out=null,err=null;
  for(const md of models){try{const r=await md.generateContent([AI_PROMPT,part]);out=JSON.parse(r.response.text().replace(/^```(json)?|```$/g,'').trim());break}catch(x){err=x}}
  if(!out)throw err;
  if(!out.name){hint.textContent='No furniture recognised in this photo. Please type the details.';return}
  const fill=(el,v)=>{if(v&&(!el.value.trim()||el.dataset.ai==='1')){el.value=String(v).slice(0,el.maxLength>0?el.maxLength:600);el.dataset.ai='1'}};
  fill(f.name,out.name);fill(f.desc,out.description);fill(f.name_sw,out.name_sw);fill(f.desc_sw,out.description_sw);
  if(CATS.some(c=>c[0]===out.category)&&(f.cat.dataset.ai==='1'||!f.pid.value)){f.cat.value=out.category;f.cat.dataset.ai='1'}
  hint.textContent='✨ Suggested from the photo. Check the name and description, change anything that is wrong, then add the price.';
  if(again)again.hidden=false;
 }catch(x){hint.textContent='Could not suggest details right now. Please type them yourself.';if(again)again.hidden=false}
}
document.addEventListener('change',e=>{const el=e.target;if(el.name==='img'&&el.closest('#pf')&&el.files[0]&&fb)suggestFromPhoto(el.files[0])});
document.addEventListener('input',e=>{const el=e.target;if(el.closest&&el.closest('#pf')&&el.dataset.ai)delete el.dataset.ai});
document.addEventListener('click',e=>{if(e.target.closest('[data-aiagain]')&&lastPhoto){const f=$('#pf');['name','desc'].forEach(k=>{if(f[k].dataset.ai==='1')f[k].value=''});f.cat.dataset.ai='1';suggestFromPhoto(lastPhoto)}});

async function translateSw(name,desc){
 const models=await aiModel();let err=null;
 const prompt=`Translate this furniture product listing from a Kenyan furniture shop into natural, simple Kenyan Swahili, as a Kenyan shop would write it. Keep loan words Kenyans commonly use (like "wall unit", "sofa", "TV") where they are clearer. Reply with JSON only: {"name_sw": "...", "description_sw": "..."}.
Name: ${name}
Description: ${desc||''}`;
 for(const md of models){try{const r=await md.generateContent(prompt);return JSON.parse(r.response.text().replace(/^```(json)?|```$/g,'').trim())}catch(x){err=x}}
 throw err;
}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-aitr],[data-trall]');if(!t||!fb)return;
 if('aitr' in t.dataset){const f=$('#pf');if(!f.name.value.trim()){toast('Type the English name first');return}
  t.textContent='Translating…';try{const r=await translateSw(f.name.value,f.desc.value);f.name_sw.value=r.name_sw||'';f.desc_sw.value=r.description_sw||'';toast('Kiswahili added. Check it, then save.')}catch(x){toast('Could not translate right now')}t.textContent='Translate English to Kiswahili'}
 else{const todo=S.products.filter(p=>!p.name_sw||!p.desc_sw);if(!todo.length){toast('All products already have Kiswahili');return}
  t.disabled=true;let n=0;for(const p of todo){t.textContent=`Translating ${++n} of ${todo.length}…`;
   try{const r=await translateSw(p.name,p.desc);await setDoc(doc(fb.db,'products',p.id),{name_sw:String(r.name_sw||'').slice(0,80),desc_sw:String(r.description_sw||'').slice(0,600),updatedAt:serverTimestamp(),updatedBy:S.user.uid},{merge:true})}catch(x){toast(errMsg(x))}}
  logAct('added Kiswahili to products');t.disabled=false;t.textContent="Add Kiswahili to products that don't have it";toast('Kiswahili added')}
});
const route=()=>{if(location.hash==='#manage')go('manage')};
addEventListener('hashchange',route);route();

render();
}
